<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - StrongWine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<nav class="navbar navbar-dark navbar-modern py-2">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/home">
            <span class="brand-logo"><i class="fa-solid fa-wine-glass"></i></span>
            StrongWine
        </a>
    </div>
</nav>

<div class="auth-page">
    <div class="auth-card fade-up">
        <div class="auth-header">
            <div class="auth-icon" style="background:linear-gradient(135deg,var(--gold-dim),var(--gold))">
                <i class="fa-solid fa-key" style="color:var(--noir)"></i>
            </div>
            <h2>Quên mật khẩu</h2>
            <p>Nhập email tài khoản để nhận liên kết đặt lại.</p>
        </div>

        <div class="auth-body">
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/forgot-password}" method="post">
                <div class="mb-4">
                    <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control form-control-lg" id="email" name="email"
                           placeholder="Nhập email tài khoản" required autofocus>
                </div>
                <button type="submit" class="btn btn-gold btn-lg w-100">
                    <i class="fa-solid fa-paper-plane me-2"></i>Gửi liên kết đặt lại
                </button>
            </form>
        </div>

        <div class="auth-footer pb-3">
            <a href="/login">← Quay lại đăng nhập</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
