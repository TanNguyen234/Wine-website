<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" data-theme="cellar">
<head th:replace="~{fragments/store-shell :: head('Đặt Lại Mật Khẩu · StrongWine')}"></head>
<body>
<div class="auth-layout">
    <aside class="auth-brand">
        <div class="between gap12">
            <a class="logo" th:href="@{/home}">
                <span class="logo-mark" aria-hidden="true">S</span>
                <span class="logo-txt">StrongWine</span>
            </a>
            <button type="button" class="icon-btn" data-theme-toggle aria-label="Chuyển chế độ giao diện" style="border-color:rgba(244,243,239,0.22);color:#f4f3ef;background:rgba(255,255,255,0.06);">
                <th:block th:replace="~{fragments/icons :: icon('sun')}"/>
            </button>
        </div>
        <div>
            <div class="eyebrow" style="color:#dbd2c2;">THIẾT LẬP MẬT KHẨU MỚI</div>
            <h1 class="serif">Cập nhật thông tin bảo mật.</h1>
            <p style="color:#b7b9c0;max-width:46ch;line-height:1.65;">Vui lòng chọn mật khẩu mới có độ bảo mật cao để bảo vệ tài khoản thành viên StrongWine.</p>
        </div>
        <div class="display-flex gap8" style="color:#8b8e96;font-size:13px;">
            <th:block th:replace="~{fragments/icons :: icon('wax-seal')}"/>
            <span>&copy; 2026 StrongWine · Maison de Vins</span>
        </div>
    </aside>

    <main class="auth-form-wrap">
        <div class="auth-form">
            <div class="eyebrow">CẬP NHẬT MẬT KHẨU</div>
            <h2 class="serif mt8 mb16" style="font-size:2rem">Đặt lại mật khẩu</h2>

            <div th:if="${success}" class="alert-sw success mb16" role="status" th:text="${success}"></div>
            <div th:if="${message}" class="alert-sw success mb16" role="status" th:text="${message}"></div>
            <div th:if="${error}" class="alert-sw danger mb16" role="alert" th:text="${error}"></div>

            <form th:action="@{/reset-password}" method="post" class="stack">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="token" th:value="${token}">
                <div>
                    <label class="label" for="password">Mật khẩu mới *</label>
                    <input type="password" id="password" name="password" class="field" required autocomplete="new-password" placeholder="Nhập mật khẩu mới">
                </div>
                <div>
                    <label class="label" for="confirmPassword">Xác nhận mật khẩu mới *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="field" required autocomplete="new-password" placeholder="Nhập lại mật khẩu mới">
                </div>
                <button type="submit" class="btn w100">Lưu mật khẩu mới &rarr;</button>
            </form>

            <div class="mt20 pt16 text-center muted" style="font-size:13px;border-top:1px solid var(--border-hairline);">
                <a th:href="@{/login}" style="color:var(--accent-gold-ink);font-weight:700;">&larr; Quay lại đăng nhập</a>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/theme-toggle.js}" defer></script>
</body>
</html>
