<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/store-shell :: head('Đặt Lại Mật Khẩu · StrongWine')}"></head>
<body>
<div class="auth-layout">
    <aside class="auth-brand">
        <a class="logo" th:href="@{/home}" style="color:#fff">
            <span class="logo-mark">S</span>
            <span class="logo-txt" style="color:#fff">StrongWine</span>
        </a>
        <div>
            <div class="eyebrow" style="color:var(--sw-champagne)">THIẾT LẬP MẬT KHẨU MỚI</div>
            <h1 class="serif mt12 mb16" style="font-size:2.4rem;line-height:1.1">Cập nhật thông tin bảo mật.</h1>
            <p style="color:#dfd3c3;max-width:46ch">Vui lòng chọn mật khẩu mới có độ bảo mật cao để bảo vệ tài khoản thành viên StrongWine.</p>
        </div>
        <div class="small" style="color:#c9b899">&copy; 2026 StrongWine · Maison de Vins</div>
    </aside>

    <main class="auth-form-wrap">
        <div class="auth-form">
            <div class="eyebrow">CẬP NHẬT MẬT KHẨU</div>
            <h2 class="serif mt8 mb16" style="font-size:2rem">Đặt lại mật khẩu</h2>

            <div th:if="${message}" class="alert-sw success mb16" th:text="${message}"></div>
            <div th:if="${error}" class="alert-sw danger mb16" th:text="${error}"></div>

            <form th:action="@{/reset-password}" method="post" class="stack">
                <input type="hidden" name="token" th:value="${token}">
                <div>
                    <label class="label" for="password">Mật khẩu mới *</label>
                    <input type="password" id="password" name="password" class="field" required placeholder="Nhập mật khẩu mới">
                </div>
                <div>
                    <label class="label" for="confirmPassword">Xác nhận mật khẩu mới *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="field" required placeholder="Nhập lại mật khẩu mới">
                </div>
                <button type="submit" class="btn w100">Lưu mật khẩu mới &rarr;</button>
            </form>

            <div class="mt20 pt16 text-center small muted" style="border-top:1px solid var(--sw-line)">
                <a th:href="@{/login}" style="color:var(--sw-bordeaux);font-weight:700">&larr; Quay lại đăng nhập</a>
            </div>
        </div>
    </main>
</div>
</body>
</html>
