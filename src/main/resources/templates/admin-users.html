<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin-shell :: head('Quản Lý Người Dùng · StrongWine Control Center')}"></head>
<body>
<div class="admin-shell">
    <aside th:replace="~{fragments/admin-shell :: sidebar('users')}"></aside>

    <div class="admin-main">
        <header th:replace="~{fragments/admin-shell :: topbar}"></header>

        <main class="admin-content">
            <div th:if="${message}" class="alert-sw success mb16" th:text="${message}"></div>
            <div th:if="${error}" class="alert-sw danger mb16" th:text="${error}"></div>

            <div class="admin-head">
                <div>
                    <div class="eyebrow">PHÂN QUYỀN &amp; BẢO MẬT TÀI KHOẢN</div>
                    <h1>Danh sách người dùng hệ thống</h1>
                    <p>Quản lý tài khoản khách hàng, quản trị viên và nhân sự giao nhận.</p>
                </div>
                <a th:href="@{/admin/users/create}" class="btn btn-sm">+ Tạo tài khoản mới</a>
            </div>

            <section class="admin-card">
                <div class="table-scroll">
                    <table class="sw-table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên đăng nhập</th>
                            <th>Email</th>
                            <th>Vai trò (Role)</th>
                            <th>Ngày tạo</th>
                            <th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${users == null or users.isEmpty()}">
                            <td colspan="6" class="text-center muted">Chưa có người dùng nào.</td>
                        </tr>
                        <tr th:each="u : ${users}">
                            <td th:text="'#' + ${u.id}">#1</td>
                            <td><strong th:text="${u.username}">username</strong></td>
                            <td th:text="${u.email}">email@example.com</td>
                            <td>
                                <span class="status"
                                      th:classappend="${u.role == 'ADMIN'} ? 'bad' : (${u.role == 'SHIPPER'} ? 'info' : 'ok')"
                                      th:text="${@enumDisplayService.userRole(u.role)}">Role</span>
                            </td>
                            <td class="small muted">Đang hoạt động</td>
                            <td>
                                <div class="display-flex gap8">
                                    <a th:href="@{/admin/users/edit/{id}(id=${u.id})}" class="btn btn-outline btn-sm">Sửa</a>
                                    <form th:action="@{/admin/users/delete/{id}(id=${u.id})}" method="post"
                                          onsubmit="return confirm('Xác nhận xoá người dùng này?');" class="d-inline">
                                        <button type="submit" class="btn btn-danger btn-sm">Xoá</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div th:replace="~{fragments/pagination :: pagination('/admin/users')}"></div>
            </section>
        </main>
    </div>
</div>
<div th:replace="~{fragments/admin-shell :: scripts}"></div>
</body>
</html>
