<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người dùng - StrongWine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="admin-page">
<div class="admin-layout">
    <aside class="admin-sidebar">
        <a class="admin-sidebar-brand" href="/admin">
            <span class="brand-logo"><i class="fa-solid fa-wine-glass"></i></span>
            StrongWine Admin
        </a>
        <nav>
            <div class="admin-sidebar-section">Điều hướng</div>
            <a class="admin-nav-link" href="/admin"><i class="fa-solid fa-chart-line"></i>Bảng điều khiển</a>
            <a class="admin-nav-link active" href="/admin/users"><i class="fa-solid fa-users"></i>Người dùng</a>
            <a class="admin-nav-link" href="/admin/shippers"><i class="fa-solid fa-truck"></i>Người giao hàng</a>
            <a class="admin-nav-link" href="/admin/shipments"><i class="fa-solid fa-box-open"></i>Đơn giao hàng</a>
            <div class="admin-sidebar-section">Vận hành</div>
            <a class="admin-nav-link" href="/shipper/dashboard"><i class="fa-solid fa-map-location-dot"></i>Màn hình giao hàng</a>
            <a class="admin-nav-link" href="/wines"><i class="fa-solid fa-store"></i>Cửa hàng</a>
        </nav>
        <div style="padding:1rem;border-top:1px solid var(--border);margin-top:auto">
            <form th:action="@{/logout}" method="post" class="mb-0">
                <button class="btn btn-outline-secondary btn-sm w-100"><i class="fa-solid fa-right-from-bracket me-1"></i>Đăng xuất</button>
            </form>
        </div>
    </aside>

    <div class="admin-main">
        <header class="admin-topbar">
            <div>
                <h1>Quản lý người dùng</h1>
                <small>Quản trị tài khoản hệ thống</small>
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-sm btn-outline-secondary" href="/wines">Cửa hàng</a>
                <a class="btn btn-gold btn-sm" href="/admin/users/create"><i class="fa-solid fa-plus me-1"></i>Thêm người dùng</a>
            </div>
        </header>

        <main class="admin-content">
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show mb-3">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-3">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="panel p-3 p-lg-4 fade-up">
                <div class="table-responsive">
                    <table class="table table-modern align-middle">
                        <thead>
                            <tr>
                                <th><span class="th-sort">ID <i class="fa-solid fa-sort"></i></span></th>
                                <th><span class="th-sort">Tài khoản <i class="fa-solid fa-sort"></i></span></th>
                                <th><span class="th-sort">Email <i class="fa-solid fa-sort"></i></span></th>
                                <th><span class="th-sort">Vai trò <i class="fa-solid fa-sort"></i></span></th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${users}">
                                <td style="color:var(--gold);font-weight:700" th:text="${u.id}"></td>
                                <td style="font-weight:600;color:var(--text)" th:text="${u.username}"></td>
                                <td style="color:var(--text-muted)" th:text="${u.email}"></td>
                                <td><span class="badge text-bg-secondary" th:text="${@enumDisplayService.userRole(u.role)}"></span></td>
                                <td>
                                    <div class="d-flex gap-2">
                                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/users/edit/{id}(id=${u.id})}">
                                            <i class="fa-solid fa-pen me-1"></i>Sửa
                                        </a>
                                        <form th:action="@{/admin/users/delete/{id}(id=${u.id})}" method="post" class="mb-0"
                                              onsubmit="return confirm('Bạn có chắc muốn xóa người dùng này?');">
                                            <button class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i></button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:replace="~{fragments/pagination :: pagination('/admin/users')}"></div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
