<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người dùng - StrongWine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="admin-page">
<div class="admin-layout">
    <aside class="admin-sidebar">
        <a class="admin-sidebar-brand" href="/admin">
            <span class="brand-logo"><i class="fa-solid fa-wine-glass"></i></span>
            <span>StrongWine Admin</span>
        </a>
        <nav>
            <a class="admin-nav-link" href="/admin"><i class="fa-solid fa-chart-line"></i>Bảng điều khiển</a>
            <a class="admin-nav-link active" href="/admin/users"><i class="fa-solid fa-users"></i>Người dùng</a>
            <a class="admin-nav-link" href="/admin/shippers"><i class="fa-solid fa-truck"></i>Người giao hàng</a>
            <a class="admin-nav-link" href="/admin/shipments"><i class="fa-solid fa-box-open"></i>Đơn giao hàng</a>
        </nav>
    </aside>

    <div class="admin-main">
        <header class="admin-topbar">
            <div>
                <h1 class="h5 mb-0">Quản lý người dùng</h1>
                <small class="text-muted">Quản trị tài khoản hệ thống</small>
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-sm btn-outline-secondary" href="/wines">Cửa hàng</a>
                <a class="btn btn-sm btn-dark" href="/admin/users/create">Thêm người dùng</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">Đăng xuất</button>
                </form>
            </div>
        </header>

        <main class="admin-content">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="panel p-3 p-lg-4 fade-up">
                <div class="table-responsive">
                    <table class="table table-modern align-middle">
                        <thead>
                        <tr>
                            <th><span class="th-sort">ID <i class="fa-solid fa-sort"></i></span></th>
                            <th><span class="th-sort">Tài khoản <i class="fa-solid fa-sort"></i></span></th>
                            <th><span class="th-sort">Email <i class="fa-solid fa-sort"></i></span></th>
                            <th><span class="th-sort">Vai trò <i class="fa-solid fa-sort"></i></span></th>
                            <th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="u : ${users}">
                            <td th:text="${u.id}"></td>
                            <td th:text="${u.username}"></td>
                            <td th:text="${u.email}"></td>
                            <td><span class="badge text-bg-secondary" th:text="${@enumDisplayService.userRole(u.role)}"></span></td>
                            <td>
                                <div class="d-flex gap-2">
                                    <a class="btn btn-sm btn-outline-dark" th:href="@{/admin/users/edit/{id}(id=${u.id})}">Sửa</a>
                                    <form th:action="@{/admin/users/delete/{id}(id=${u.id})}" method="post" onsubmit="return confirm('Bạn có chắc muốn xóa người dùng này?');">
                                        <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <nav class="mt-3" aria-label="Điều hướng bảng người dùng">
                    <ul class="pagination pagination-modern pagination-sm mb-0">
                        <li class="page-item disabled"><span class="page-link">Trước</span></li>
                        <li class="page-item active"><span class="page-link">1</span></li>
                        <li class="page-item disabled"><span class="page-link">Sau</span></li>
                    </ul>
                </nav>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
