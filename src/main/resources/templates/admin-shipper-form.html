<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editingShipper != null ? 'Cập nhật shipper' : 'Tạo shipper'}">Shipper form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<nav class="navbar navbar-dark navbar-modern py-3">
    <div class="container d-flex justify-content-between">
        <a class="navbar-brand" href="/admin">StrongWine Quản trị</a>
        <div class="d-flex gap-2">
            <a class="btn btn-sm btn-outline-light" href="/admin/shippers">Danh sách shipper</a>
            <a class="btn btn-sm btn-light" href="/admin/shipments">Quản lý shipment</a>
        </div>
    </div>
</nav>

<main class="container my-5 admin-form-wrap">
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="panel p-4">
        <h1 class="h5 mb-4" th:text="${editingShipper != null ? 'Cập nhật shipper' : 'Tạo shipper mới'}"></h1>

        <form th:action="${editingShipper != null ? '/admin/shippers/edit/' + editingShipper.id : '/admin/shippers/create'}" method="post">
            <div class="mb-3">
                <label class="form-label">Tài khoản shipper (role SHIPPER)</label>
                <select class="form-select" name="userId" required>
                    <option value="" disabled th:selected="${editingShipper == null}">-- Chọn user --</option>
                    <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.username}"
                            th:selected="${editingShipper != null and editingShipper.user.id == u.id}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Tên shipper</label>
                <input class="form-control" name="name" required th:value="${editingShipper != null ? editingShipper.name : ''}">
            </div>
            <div class="mb-3">
                <label class="form-label">Số điện thoại</label>
                <input class="form-control" name="phone" required th:value="${editingShipper != null ? editingShipper.phone : ''}" placeholder="Ví dụ: 0901234567">
            </div>
            <div class="mb-3">
                <label class="form-label">Phương tiện</label>
                <input class="form-control" name="vehicleType" th:value="${editingShipper != null ? editingShipper.vehicleType : ''}" placeholder="Ví dụ: Xe máy, ô tô">
            </div>
            <div class="mb-3">
                <label class="form-label">Trạng thái</label>
                <select class="form-select" name="status">
                    <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"
                            th:selected="${editingShipper != null and editingShipper.status == st}"></option>
                </select>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" name="isAvailable" id="availableCheck" th:checked="${editingShipper != null and editingShipper.isAvailable}">
                <label class="form-check-label" for="availableCheck">Sẵn sàng nhận đơn</label>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-dark" type="submit">Lưu</button>
                <a class="btn btn-outline-secondary" href="/admin/shippers">Quay lại</a>
            </div>
        </form>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
