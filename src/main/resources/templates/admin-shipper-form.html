<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin-shell :: head((${editingShipper != null and editingShipper.id != null} ? 'Cập Nhật Shipper' : 'Thêm Shipper Mới') + ' · StrongWine')}"></head>
<body>
<div class="admin-shell">
    <aside th:replace="~{fragments/admin-shell :: sidebar('shippers')}"></aside>

    <div class="admin-main">
        <header th:replace="~{fragments/admin-shell :: topbar}"></header>

        <main class="admin-content" style="max-width:820px">
            <div th:if="${error}" class="alert-sw danger mb16" th:text="${error}"></div>

            <div class="admin-head">
                <div>
                    <div class="eyebrow">HỒ SƠ NHÂN VIÊN GIAO HÀNG</div>
                    <h1 th:text="${editingShipper != null and editingShipper.id != null ? 'Chỉnh sửa thông tin Shipper' : 'Thêm nhân viên giao hàng mới'}">Shipper Form</h1>
                </div>
                <a th:href="@{/admin/shippers}" class="btn btn-outline btn-sm">&larr; Quay lại danh sách</a>
            </div>

            <section class="admin-card">
                <form th:action="${editingShipper != null and editingShipper.id != null} ? @{/admin/shippers/edit/{id}(id=${editingShipper.id})} : @{/admin/shippers/create}"
                      method="post" class="stack">
                    <div>
                        <label class="label" for="userId">Tài khoản đăng nhập liên kết *</label>
                        <select id="userId" name="userId" class="select" required>
                            <option value="">-- Chọn tài khoản người dùng --</option>
                            <option th:each="u : ${users}"
                                    th:value="${u.id}"
                                    th:text="${u.username + ' (' + u.email + ')'}"
                                    th:selected="${editingShipper != null and editingShipper.user != null and editingShipper.user.id == u.id}">User</option>
                        </select>
                    </div>

                    <div class="grid-2">
                        <div>
                            <label class="label" for="name">Họ và tên tài xế *</label>
                            <input type="text" id="name" name="name" class="field" required
                                   th:value="${editingShipper != null ? editingShipper.name : ''}" placeholder="Nguyễn Văn Giao">
                        </div>
                        <div>
                            <label class="label" for="phone">Số điện thoại liên hệ *</label>
                            <input type="text" id="phone" name="phone" class="field" required
                                   th:value="${editingShipper != null ? editingShipper.phone : ''}" placeholder="0909123456">
                        </div>
                    </div>

                    <div class="grid-2">
                        <div>
                            <label class="label" for="vehicleType">Phương tiện vận chuyển *</label>
                            <input type="text" id="vehicleType" name="vehicleType" class="field" required
                                   th:value="${editingShipper != null and editingShipper.vehicleType != null ? editingShipper.vehicleType : 'Xe máy thùng bảo ôn'}"
                                   placeholder="Xe máy thùng bảo ôn">
                        </div>
                        <div>
                            <label class="label" for="status">Trạng thái công tác</label>
                            <select id="status" name="status" class="select">
                                <option th:each="st : ${statuses}"
                                        th:value="${st.name()}"
                                        th:text="${@enumDisplayService.shipperStatus(st)}"
                                        th:selected="${editingShipper != null and editingShipper.status == st}">ACTIVE</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="check-line">
                            <input type="checkbox" name="isAvailable" value="true"
                                   th:checked="${editingShipper == null or editingShipper.isAvailable}">
                            <span>Cho phép nhận phân công đơn hàng mới tự động</span>
                        </label>
                    </div>

                    <div class="between pt16" style="border-top:1px solid var(--sw-line)">
                        <a th:href="@{/admin/shippers}" class="btn btn-outline">Huỷ</a>
                        <button type="submit" class="btn">Lưu hồ sơ Shipper</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
</div>
<div th:replace="~{fragments/admin-shell :: scripts}"></div>
</body>
</html>
