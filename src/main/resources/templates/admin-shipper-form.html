<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editingShipper != null ? 'Cập nhật người giao hàng' : 'Tạo người giao hàng'}">Biểu mẫu người giao hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="admin-page">
<div class="admin-layout">
    <aside class="admin-sidebar">
        <a class="admin-sidebar-brand" href="/admin">
            <span class="brand-logo"><i class="fa-solid fa-wine-glass"></i></span>
            <span>StrongWine Admin</span>
        </a>
        <nav>
            <a class="admin-nav-link" href="/admin"><i class="fa-solid fa-chart-line"></i>Bảng điều khiển</a>
            <a class="admin-nav-link" href="/admin/users"><i class="fa-solid fa-users"></i>Người dùng</a>
            <a class="admin-nav-link active" href="/admin/shippers"><i class="fa-solid fa-truck"></i>Người giao hàng</a>
            <a class="admin-nav-link" href="/admin/shipments"><i class="fa-solid fa-box-open"></i>Đơn giao hàng</a>
        </nav>
    </aside>

    <div class="admin-main">
        <header class="admin-topbar">
            <div>
                <h1 class="h5 mb-0" th:text="${editingShipper != null ? 'Cập nhật người giao hàng' : 'Tạo người giao hàng mới'}"></h1>
                <small class="text-muted">Quản lý hồ sơ giao nhận và trạng thái sẵn sàng</small>
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-sm btn-outline-secondary" href="/admin/shippers">Danh sách</a>
                <a class="btn btn-sm btn-outline-secondary" href="/admin/shipments">Đơn giao hàng</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">Đăng xuất</button>
                </form>
            </div>
        </header>

        <main class="admin-content">
            <div class="admin-form-wrap">
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="panel p-4 p-lg-5 fade-up">
                    <form th:action="${editingShipper != null ? '/admin/shippers/edit/' + editingShipper.id : '/admin/shippers/create'}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Tài khoản giao hàng (vai trò người giao hàng)</label>
                            <select class="form-select" name="userId" required>
                                <option value="" disabled th:selected="${editingShipper == null}">-- Chọn tài khoản --</option>
                                <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.username}"
                                        th:selected="${editingShipper != null and editingShipper.user.id == u.id}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tên người giao hàng</label>
                            <input class="form-control" name="name" required th:value="${editingShipper != null ? editingShipper.name : ''}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Số điện thoại</label>
                            <input class="form-control" name="phone" required th:value="${editingShipper != null ? editingShipper.phone : ''}" placeholder="Ví dụ: 0901234567">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phương tiện</label>
                            <input class="form-control" name="vehicleType" th:value="${editingShipper != null ? editingShipper.vehicleType : ''}" placeholder="Ví dụ: Xe máy, ô tô">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Trạng thái</label>
                            <select class="form-select" name="status">
                                <option th:each="st : ${statuses}" th:value="${st}" th:text="${@enumDisplayService.shipperStatus(st)}"
                                        th:selected="${editingShipper != null and editingShipper.status == st}"></option>
                            </select>
                        </div>
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" name="isAvailable" id="availableCheck" th:checked="${editingShipper != null and editingShipper.isAvailable}">
                            <label class="form-check-label" for="availableCheck">Sẵn sàng nhận đơn</label>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-dark" type="submit">Lưu</button>
                            <a class="btn btn-outline-secondary" href="/admin/shippers">Quay lại</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
