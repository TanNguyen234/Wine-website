<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-shell :: head('Hồ sơ Shipper')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin-shell :: sidebar('shippers')}"></aside>

    <div class="admin-main-wrap">
        <header th:replace="~{fragments/admin-shell :: topbar}"></header>

        <main class="admin-main" id="main-content" th:with="sp=${editingShipper != null ? editingShipper : shipper}">
            <div class="admin-page-header">
                <div>
                    <h1 class="admin-page-title"
                        th:text="${sp != null and sp.id != null ? ('Cập nhật shipper #' + sp.id) : 'Thêm shipper giao hàng mới'}">Hồ sơ Shipper</h1>
                    <p class="admin-page-subtitle">Gắn tài khoản ROLE_SHIPPER với phương tiện vận chuyển bảo quản rượu chuyên dụng.</p>
                </div>
                <a th:href="@{/admin/shippers}" class="btn btn-secondary btn-sm">Quay lại danh sách</a>
            </div>

            <div th:if="${error != null}" class="admin-card mb-3" role="alert" style="border-left: 4px solid var(--status-danger-ink);">
                <strong class="status bad">Lỗi</strong>
                <span class="ms-2" th:text="${error}">Không thể lưu thông tin shipper.</span>
            </div>

            <section class="admin-card">
                <form th:action="${sp != null and sp.id != null ? '/admin/shippers/edit/' + sp.id : '/admin/shippers/create'}"
                      method="post" class="admin-form-grid">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="form-group">
                        <label for="shipperUserSelect" class="form-label">Tài khoản đăng nhập</label>
                        <select id="shipperUserSelect" name="userId" class="form-select" required>
                            <option value="">-- Chọn tài khoản shipper --</option>
                            <option th:each="u : ${users}"
                                    th:value="${u.id}"
                                    th:selected="${sp != null and sp.user != null and sp.user.id == u.id}"
                                    th:text="${u.username + (u.email != null ? ' (' + u.email + ')' : '')}">user</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="shipperName" class="form-label">Họ và tên</label>
                        <input type="text" id="shipperName" name="name" class="form-control"
                               th:value="${sp != null ? sp.name : ''}" placeholder="VD: Trần Minh Giao" required/>
                    </div>

                    <div class="form-group">
                        <label for="shipperPhone" class="form-label">Số điện thoại liên hệ</label>
                        <input type="text" id="shipperPhone" name="phone" class="form-control"
                               th:value="${sp != null ? sp.phone : ''}" placeholder="0901234567" required/>
                    </div>

                    <div class="form-group">
                        <label for="shipperVehicle" class="form-label">Phương tiện giao hàng</label>
                        <input type="text" id="shipperVehicle" name="vehicleType" class="form-control"
                               th:value="${sp != null ? sp.vehicleType : ''}"
                               placeholder="Xe máy thùng bảo ôn"/>
                        <div class="small text-secondary mt-1">Khuyến nghị: Xe máy thùng bảo ôn hoặc xe van giữ nhiệt vang cao cấp.</div>
                    </div>

                    <div class="form-group">
                        <label for="shipperStatusSelect" class="form-label">Trạng thái làm việc</label>
                        <select id="shipperStatusSelect" name="status" class="form-select">
                            <option th:each="st : ${statuses != null ? statuses : T(com.strongwine.strongwine.entity.ShipperStatus).values()}"
                                    th:value="${st.name()}"
                                    th:selected="${sp != null and sp.status == st}"
                                    th:text="${@enumDisplayService.shipperStatus(st)}">Hoạt động</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="shipperMaxConcurrent" class="form-label">Số đơn giao đồng thời tối đa</label>
                        <input type="number" id="shipperMaxConcurrent" name="maxConcurrentShipments" class="form-control"
                               min="1" max="50"
                               th:value="${sp != null and sp.maxConcurrentShipments != null ? sp.maxConcurrentShipments : 5}"
                               required/>
                        <div class="small text-secondary mt-1">Hạn mức vận đơn đang giao tối đa cùng lúc (mặc định: 5).</div>
                    </div>

                    <div class="form-group d-flex align-items-end">
                        <label class="d-flex align-items-center gap-2 mb-2">
                            <input type="checkbox" name="isAvailable" value="true"
                                   th:checked="${sp != null and sp.isAvailable != null ? sp.isAvailable : true}"/>
                            <span>Đang sẵn sàng nhận vận đơn mới</span>
                        </label>
                    </div>

                    <div class="d-flex justify-content-end gap-2" style="grid-column: 1 / -1;">
                        <a th:href="@{/admin/shippers}" class="btn btn-secondary">Hủy</a>
                        <button type="submit" class="btn btn-primary"
                                th:text="${sp != null and sp.id != null ? 'Lưu cập nhật' : 'Tạo hồ sơ shipper'}">Lưu shipper</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
</div>

<div th:replace="~{fragments/admin-shell :: scripts}"></div>
</body>
</html>
