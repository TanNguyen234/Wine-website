<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin-shell :: head((${editingUser != null and editingUser.id != null} ? 'Chỉnh Sửa Người Dùng' : 'Tạo Người Dùng Mới') + ' · StrongWine')}"></head>
<body>
<div class="admin-shell">
    <aside th:replace="~{fragments/admin-shell :: sidebar('users')}"></aside>

    <div class="admin-main">
        <header th:replace="~{fragments/admin-shell :: topbar}"></header>

        <main class="admin-content" style="max-width:780px">
            <div th:if="${error}" class="alert-sw danger mb16" th:text="${error}"></div>

            <div class="admin-head">
                <div>
                    <div class="eyebrow">QUẢN TRỊ TÀI KHOẢN</div>
                    <h1 th:text="${editingUser != null and editingUser.id != null ? 'Cập nhật thông tin tài khoản' : 'Tạo tài khoản mới'}">User Form</h1>
                </div>
                <a th:href="@{/admin/users}" class="btn btn-outline btn-sm">&larr; Quay lại danh sách</a>
            </div>

            <section class="admin-card">
                <form th:action="${editingUser != null and editingUser.id != null} ? @{/admin/users/edit/{id}(id=${editingUser.id})} : @{/admin/users/create}"
                      method="post" class="stack">
                    <div class="grid-2">
                        <div>
                            <label class="label" for="username">Tên đăng nhập *</label>
                            <input type="text" id="username" name="username" class="field" required
                                   th:value="${editingUser != null ? editingUser.username : ''}">
                        </div>
                        <div>
                            <label class="label" for="email">Địa chỉ Email *</label>
                            <input type="email" id="email" name="email" class="field" required
                                   th:value="${editingUser != null ? editingUser.email : ''}">
                        </div>
                    </div>

                    <div class="grid-2">
                        <div>
                            <label class="label" for="password"
                                   th:text="${editingUser != null and editingUser.id != null ? 'Mật khẩu mới (để trống nếu giữ nguyên)' : 'Mật khẩu khởi tạo *'}">Mật khẩu</label>
                            <input type="password" id="password" name="password" class="field"
                                   th:required="${editingUser == null or editingUser.id == null}"
                                   placeholder="••••••••">
                        </div>
                        <div>
                            <label class="label" for="role">Phân quyền hệ thống *</label>
                            <select id="role" name="role" class="select" required>
                                <option th:each="r : ${roles}"
                                        th:value="${r}"
                                        th:text="${@enumDisplayService.userRole(r)}"
                                        th:selected="${editingUser != null and editingUser.role == r}">USER</option>
                            </select>
                        </div>
                    </div>

                    <div class="between pt16" style="border-top:1px solid var(--sw-line)">
                        <a th:href="@{/admin/users}" class="btn btn-outline">Huỷ</a>
                        <button type="submit" class="btn">Lưu tài khoản</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
</div>
<div th:replace="~{fragments/admin-shell :: scripts}"></div>
</body>
</html>
