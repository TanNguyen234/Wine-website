<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editingUser != null ? 'Cập nhật người dùng' : 'Tạo người dùng'} + ' - StrongWine'">Biểu mẫu người dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="admin-page">
<div class="admin-layout">
    <aside class="admin-sidebar">
        <a class="admin-sidebar-brand" href="/admin">
            <span class="brand-logo"><i class="fa-solid fa-wine-glass"></i></span>
            <span>StrongWine Admin</span>
        </a>
        <nav>
            <a class="admin-nav-link" href="/admin"><i class="fa-solid fa-chart-line"></i>Bảng điều khiển</a>
            <a class="admin-nav-link active" href="/admin/users"><i class="fa-solid fa-users"></i>Người dùng</a>
            <a class="admin-nav-link" href="/admin/shippers"><i class="fa-solid fa-truck"></i>Người giao hàng</a>
            <a class="admin-nav-link" href="/admin/shipments"><i class="fa-solid fa-box-open"></i>Đơn giao hàng</a>
        </nav>
    </aside>

    <div class="admin-main">
        <header class="admin-topbar">
            <div>
                <h1 class="h5 mb-0" th:text="${editingUser != null ? 'Cập nhật người dùng #' + editingUser.id : 'Tạo người dùng mới'}"></h1>
                <small class="text-muted">Chuẩn hóa thông tin tài khoản và phân quyền</small>
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-sm btn-outline-secondary" href="/admin/users">Danh sách người dùng</a>
                <a class="btn btn-sm btn-outline-secondary" href="/wines">Cửa hàng</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">Đăng xuất</button>
                </form>
            </div>
        </header>

        <main class="admin-content">
            <div class="admin-form-wrap">
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="panel p-4 p-lg-5 fade-up">
                    <form th:action="${editingUser != null ? '/admin/users/edit/' + editingUser.id : '/admin/users/create'}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Tên đăng nhập</label>
                            <input class="form-control" name="username" required
                                   th:value="${editingUser != null ? editingUser.username : ''}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input class="form-control" type="email" name="email" required
                                   th:value="${editingUser != null ? editingUser.email : ''}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" th:text="${editingUser != null ? 'Mật khẩu mới (để trống nếu không đổi)' : 'Mật khẩu'}"></label>
                            <input class="form-control" type="password" name="password" th:required="${editingUser == null}">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Vai trò</label>
                            <select class="form-select" name="role" required>
                                <option value="" disabled th:selected="${editingUser == null}">-- Chọn vai trò --</option>
                                <option th:each="role : ${roles}" th:value="${role}" th:text="${@enumDisplayService.userRole(role)}"
                                        th:selected="${editingUser != null and editingUser.role == role}"></option>
                            </select>
                        </div>

                        <div class="d-flex gap-2">
                            <button class="btn btn-dark" type="submit">Lưu người dùng</button>
                            <a class="btn btn-outline-secondary" href="/admin/users">Quay lại</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
