<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editingUser != null ? 'Cập nhật người dùng' : 'Tạo người dùng'} + ' - StrongWine'">Biểu mẫu người dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="admin-page">
<div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar shadow-sm">
        <div class="px-4 py-4 mb-3">
            <a class="admin-sidebar-brand d-flex align-items-center gap-3" href="/admin">
                <span class="brand-logo shadow-sm"><i class="fa-solid fa-wine-glass"></i></span>
                <div class="lh-1">
                    <span class="fw-bold d-block">StrongWine</span>
                    <small class="text-muted text-uppercase fw-bold" style="font-size: 0.65rem; letter-spacing: 0.05em;">Admin Console</small>
                </div>
            </a>
        </div>
        
        <nav class="admin-nav px-3">
            <div class="text-muted small fw-bold text-uppercase px-3 mb-2" style="font-size: 0.7rem; letter-spacing: 0.1em;">Vận hành</div>
            <a class="admin-nav-link" href="/admin">
                <i class="fa-solid fa-chart-pie"></i><span>Tổng quan</span>
            </a>
            <a class="admin-nav-link" href="/admin/shipments">
                <i class="fa-solid fa-truck-ramp-box"></i><span>Đơn giao hàng</span>
            </a>
            <a class="admin-nav-link" href="/admin/shipments/traffic">
                <i class="fa-solid fa-map-location-dot"></i><span>Trạm điều phối</span>
            </a>
            
            <div class="text-muted small fw-bold text-uppercase px-3 mt-4 mb-2" style="font-size: 0.7rem; letter-spacing: 0.1em;">Quản lý</div>
            <a class="admin-nav-link active" href="/admin/users">
                <i class="fa-solid fa-users"></i><span>Người dùng</span>
            </a>
            <a class="admin-nav-link" href="/admin/shippers">
                <i class="fa-solid fa-id-badge"></i><span>Đội ngũ Shipper</span>
            </a>
            <a class="admin-nav-link" href="/wines">
                <i class="fa-solid fa-store"></i><span>Xem cửa hàng</span>
            </a>
        </nav>
        
        <div class="mt-auto px-3 pb-4">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-light w-100 text-danger small fw-bold border-0 py-2">
                    <i class="fa-solid fa-right-from-bracket me-2"></i> Đăng xuất
                </button>
            </form>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="admin-main">
        <header class="admin-topbar sticky-top bg-white border-bottom px-4">
            <div class="d-flex align-items-center justify-content-between w-100">
                <div>
                    <h2 class="h5 fw-bold mb-0" th:text="${editingUser != null ? 'Chỉnh sửa tài khoản' : 'Thêm tài khoản mới'}">Thiết lập người dùng</h2>
                    <p class="text-muted small mb-0 d-none d-md-block" th:text="${editingUser != null ? 'Cập nhật thông tin chi tiết cho người dùng #' + editingUser.id : 'Đăng ký tài khoản hệ thống mới cho nhân viên hoặc khách hàng.'}">Thông tin chi tiết.</p>
                </div>
                
                <div class="d-flex align-items-center gap-3">
                    <a class="btn btn-outline-dark btn-sm rounded-pill px-4 py-2" href="/admin/users">
                        <i class="fa-solid fa-arrow-left me-1 small"></i> Danh sách
                    </a>
                </div>
            </div>
        </header>

        <main class="admin-content p-4 d-flex justify-content-center pt-5">
            <div class="w-100" style="max-width: 600px;">
                <!-- Alert Messages -->
                <div th:if="${success}" class="alert alert-success border-0 shadow-sm mb-4 alert-dismissible fade show fade-up" role="alert">
                    <i class="fa-solid fa-circle-check me-2"></i>
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger border-0 shadow-sm mb-4 alert-dismissible fade show fade-up" role="alert">
                    <i class="fa-solid fa-circle-xmark me-2"></i>
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Form Panel -->
                <div class="bg-white border rounded-4 p-4 p-md-5 shadow-sm fade-up">
                    <form th:action="${editingUser != null ? '/admin/users/edit/' + editingUser.id : '/admin/users/create'}" method="post">
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Tên đăng nhập</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 px-3 text-muted"><i class="fa-solid fa-user small"></i></span>
                                <input class="form-control border-0 bg-light px-3 py-2" name="username" required
                                       th:value="${editingUser != null ? editingUser.username : ''}" placeholder="Vd: tannguyen25">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Địa chỉ Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 px-3 text-muted"><i class="fa-solid fa-envelope small"></i></span>
                                <input class="form-control border-0 bg-light px-3 py-2" type="email" name="email" required
                                       th:value="${editingUser != null ? editingUser.email : ''}" placeholder="example@strongwine.com">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-2" th:text="${editingUser != null ? 'Mật khẩu mới (Tùy chọn)' : 'Mật khẩu truy cập'}"></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 px-3 text-muted"><i class="fa-solid fa-key small"></i></span>
                                <input class="form-control border-0 bg-light px-3 py-2" type="password" name="password" th:required="${editingUser == null}" placeholder="••••••••">
                            </div>
                            <div class="form-text small" th:if="${editingUser != null}">Để trống nếu không muốn thay đổi mật khẩu hiện tại.</div>
                        </div>

                        <div class="mb-5">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Phân quyền vai trò</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 px-3 text-muted"><i class="fa-solid fa-shield-halved small"></i></span>
                                <select class="form-select border-0 bg-light px-3 py-2" name="role" required>
                                    <option value="" disabled th:selected="${editingUser == null}">-- Chọn vai trò --</option>
                                    <option th:each="role : ${roles}" th:value="${role}" th:text="${@enumDisplayService.userRole(role)}"
                                            th:selected="${editingUser != null and editingUser.role == role}"></option>
                                </select>
                            </div>
                        </div>

                        <hr class="my-4 opacity-5">

                        <div class="d-grid gap-3 d-md-flex justify-content-md-end">
                            <a class="btn btn-light rounded-pill px-5 py-2 fw-bold text-muted" href="/admin/users">Hủy bỏ</a>
                            <button class="btn btn-dark rounded-pill px-5 py-2 fw-bold shadow-sm" type="submit">
                                <i class="fa-solid fa-floppy-disk me-2 small"></i> Lưu thay đổi
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
