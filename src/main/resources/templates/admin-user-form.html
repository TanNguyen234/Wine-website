<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editingUser != null ? 'Cập nhật người dùng' : 'Tạo người dùng'} + ' - StrongWine'">User form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<nav class="navbar navbar-dark navbar-modern py-3">
    <div class="container d-flex justify-content-between">
        <a class="navbar-brand" href="/admin">StrongWine Quản trị</a>
        <div class="d-flex gap-2">
            <a class="btn btn-sm btn-outline-light" href="/admin/users">Danh sách user</a>
            <a class="btn btn-sm btn-light" href="/admin/shippers">Quản lý shipper</a>
        </div>
    </div>
</nav>

<main class="container my-5 admin-form-wrap">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="panel p-4">
        <h1 class="h5 mb-4" th:text="${editingUser != null ? 'Cập nhật người dùng #' + editingUser.id : 'Tạo người dùng mới'}"></h1>

        <form th:action="${editingUser != null ? '/admin/users/edit/' + editingUser.id : '/admin/users/create'}" method="post">
            <div class="mb-3">
                <label class="form-label">Tên đăng nhập</label>
                <input class="form-control" name="username" required
                       th:value="${editingUser != null ? editingUser.username : ''}">
            </div>

            <div class="mb-3">
                <label class="form-label" th:text="${editingUser != null ? 'Mật khẩu mới (để trống nếu không đổi)' : 'Mật khẩu'}"></label>
                <input class="form-control" type="password" name="password" th:required="${editingUser == null}">
            </div>

            <div class="mb-3">
                <label class="form-label">Vai trò</label>
                <select class="form-select" name="role" required>
                    <option value="" disabled th:selected="${editingUser == null}">-- Chọn vai trò --</option>
                    <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"
                            th:selected="${editingUser != null and editingUser.role == role}"></option>
                </select>
            </div>

            <div class="d-flex gap-2">
                <button class="btn btn-dark" type="submit">Lưu user</button>
                <a class="btn btn-outline-secondary" href="/admin/users">Quay lại</a>
            </div>
        </form>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
