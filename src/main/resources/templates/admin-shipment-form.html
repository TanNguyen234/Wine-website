<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin-shell :: head('Cập Nhật Vận Đơn · StrongWine Control Center')}"></head>
<body>
<div class="admin-shell">
    <aside th:replace="~{fragments/admin-shell :: sidebar('shipments')}"></aside>

    <div class="admin-main">
        <header th:replace="~{fragments/admin-shell :: topbar}"></header>

        <main class="admin-content" style="max-width:860px">
            <div th:if="${error}" class="alert-sw danger mb16" th:text="${error}"></div>

            <div class="admin-head">
                <div>
                    <div class="eyebrow">CHỈNH SỬA THÔNG TIN VẬN ĐƠN</div>
                    <h1 th:text="'Vận đơn #' + ${editingShipment.id}">Vận đơn #1</h1>
                </div>
                <a th:href="@{/admin/shipments}" class="btn btn-outline btn-sm">&larr; Quay lại danh sách</a>
            </div>

            <section class="admin-card">
                <form th:action="@{/admin/shipments/edit/{id}(id=${editingShipment.id})}" method="post" class="stack">
                    <div class="grid-2">
                        <div>
                            <label class="label" for="shippingName">Tên người nhận *</label>
                            <input type="text" id="shippingName" name="shippingName" class="field" required
                                   th:value="${editingShipment.shippingName}">
                        </div>
                        <div>
                            <label class="label" for="shippingPhone">Số điện thoại người nhận *</label>
                            <input type="text" id="shippingPhone" name="shippingPhone" class="field" required
                                   th:value="${editingShipment.shippingPhone}">
                        </div>
                    </div>

                    <div>
                        <label class="label" for="shippingAddress">Địa chỉ giao nhận *</label>
                        <input type="text" id="shippingAddress" name="shippingAddress" class="field" required
                               th:value="${editingShipment.shippingAddress}">
                    </div>

                    <div class="grid-2">
                        <div>
                            <label class="label" for="status">Trạng thái vận đơn</label>
                            <select id="status" name="status" class="select">
                                <option th:each="st : ${statuses}"
                                        th:value="${st.name()}"
                                        th:text="${@enumDisplayService.shipmentStatus(st)}"
                                        th:selected="${editingShipment.status == st}">Status</option>
                            </select>
                        </div>
                        <div>
                            <label class="label" for="failureNote">Ghi chú vận hành / Lý do sự cố</label>
                            <input type="text" id="failureNote" name="failureNote" class="field"
                                   th:value="${editingShipment.failureNote}"
                                   placeholder="Ghi chú nếu giao hàng thất bại hoặc điều chỉnh">
                        </div>
                    </div>

                    <div class="between pt16" style="border-top:1px solid var(--sw-line)">
                        <a th:href="@{/admin/shipments}" class="btn btn-outline">Huỷ</a>
                        <button type="submit" class="btn">Lưu thay đổi vận đơn</button>
                    </div>
                </form>

                <div th:if="${canDelete}" class="mt20 pt16" style="border-top:1px dashed var(--sw-line)">
                    <form th:action="@{/admin/shipments/{id}/delete(id=${editingShipment.id})}" method="post"
                          onsubmit="return confirm('Xác nhận xoá vận đơn này?');">
                        <button type="submit" class="btn btn-danger btn-sm">Xoá vận đơn</button>
                    </form>
                </div>
            </section>
        </main>
    </div>
</div>
<div th:replace="~{fragments/admin-shell :: scripts}"></div>
</body>
</html>
