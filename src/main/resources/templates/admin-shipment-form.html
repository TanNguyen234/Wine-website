<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-shell :: head('Cập nhật vận đơn')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin-shell :: sidebar('shipments')}"></aside>

    <div class="admin-main-wrap">
        <header th:replace="~{fragments/admin-shell :: topbar}"></header>

        <main class="admin-main" id="main-content" th:with="s=${editingShipment != null ? editingShipment : shipment}">
            <div class="admin-page-header">
                <div>
                    <h1 class="admin-page-title" th:text="${s != null and s.id != null ? ('Vận đơn #' + s.id) : 'Cập nhật vận đơn'}">Vận đơn #50</h1>
                    <p class="admin-page-subtitle">Điều chỉnh thông tin người nhận, địa chỉ giao hàng và trạng thái xử lý vận đơn.</p>
                </div>
                <a th:href="@{/admin/shipments}" class="btn btn-secondary btn-sm">Quay lại danh sách</a>
            </div>

            <div th:if="${success != null}" class="admin-card mb-3" role="status" style="border-left: 4px solid var(--status-ok-ink);">
                <strong class="status ok">Thành công</strong>
                <span class="ms-2" th:text="${success}">Đã cập nhật.</span>
            </div>
            <div th:if="${error != null}" class="admin-card mb-3" role="alert" style="border-left: 4px solid var(--status-danger-ink);">
                <strong class="status bad">Lỗi</strong>
                <span class="ms-2" th:text="${error}">Không thể lưu vận đơn.</span>
            </div>

            <section class="admin-card">
                <form th:action="${s != null and s.id != null ? '/admin/shipments/edit/' + s.id : '/admin/shipments'}"
                      method="post" class="admin-form-grid">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="form-group">
                        <label for="shippingName" class="form-label">Tên người nhận</label>
                        <input type="text" id="shippingName" name="shippingName" class="form-control"
                               th:value="${s != null ? s.shippingName : ''}" required/>
                    </div>

                    <div class="form-group">
                        <label for="shippingPhone" class="form-label">Số điện thoại nhận hàng</label>
                        <input type="text" id="shippingPhone" name="shippingPhone" class="form-control"
                               th:value="${s != null ? s.shippingPhone : ''}" required/>
                    </div>

                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label for="shippingAddress" class="form-label">Địa chỉ giao hàng</label>
                        <input type="text" id="shippingAddress" name="shippingAddress" class="form-control"
                               th:value="${s != null ? s.shippingAddress : ''}" required/>
                    </div>

                    <div class="form-group">
                        <label for="shipmentStatusSelect" class="form-label">Trạng thái vận đơn</label>
                        <select id="shipmentStatusSelect" name="status" class="form-select">
                            <option th:each="st : ${statuses != null ? statuses : T(com.strongwine.strongwine.entity.ShipmentStatus).values()}"
                                    th:value="${st.name()}"
                                    th:selected="${s != null and s.status == st}"
                                    th:text="${@enumDisplayService.shipmentStatus(st)}">Trạng thái</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Shipper hiện tại</label>
                        <input type="text" class="form-control" readonly
                               th:value="${s != null and s.shipper != null ? (s.shipper.name + ' (' + (s.shipper.phone ?: '') + ')') : 'Chưa phân công'}"/>
                    </div>

                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label for="failureNote" class="form-label">Ghi chú giao nhận / Lý do sự cố</label>
                        <textarea id="failureNote" name="failureNote" rows="3" class="form-control"
                                  th:text="${s != null ? s.failureNote : ''}"></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2" style="grid-column: 1 / -1;">
                        <a th:href="@{/admin/shipments}" class="btn btn-secondary">Hủy</a>
                        <button type="submit" class="btn btn-primary">Lưu thay đổi vận đơn</button>
                    </div>
                </form>

                <div th:if="${(canDelete ?: false) and s != null and s.id != null}" class="mt-4 pt-3" style="border-top: 1px solid var(--border-hairline);">
                    <form th:action="@{/admin/shipments/{id}/delete(id=${s.id})}" method="post" class="d-inline">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-danger btn-sm">Xóa vận đơn chờ phân công</button>
                    </form>
                </div>
            </section>
        </main>
    </div>
</div>

<div th:replace="~{fragments/admin-shell :: scripts}"></div>
</body>
</html>
