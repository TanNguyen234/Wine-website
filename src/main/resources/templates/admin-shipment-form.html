<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editingShipment != null ? 'Cập nhật shipment' : 'Tạo shipment'} + ' - StrongWine'">Form shipment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<nav class="navbar navbar-dark navbar-modern py-3">
    <div class="container d-flex justify-content-between">
        <a class="navbar-brand" href="/admin">StrongWine Quản trị</a>
        <div class="d-flex gap-2">
            <a class="btn btn-sm btn-outline-light" href="/admin/shipments">Danh sách shipment</a>
            <a class="btn btn-sm btn-light" href="/admin/shippers">Quản lý shipper</a>
        </div>
    </div>
</nav>

<main class="container my-5 admin-form-wrap">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="panel p-4">
        <h1 class="h5 mb-4" th:text="${editingShipment != null ? 'Cập nhật shipment #' + editingShipment.id : 'Tạo shipment mới'}"></h1>

        <form th:action="${editingShipment != null ? '/admin/shipments/edit/' + editingShipment.id : '/admin/shipments/create'}" method="post">
            <div class="mb-3" th:if="${editingShipment == null}">
                <label class="form-label">Chọn order đã thanh toán (PAID)</label>
                <select class="form-select" name="orderId" required>
                    <option value="" disabled selected>-- Chọn order --</option>
                    <option th:each="od : ${eligibleOrders}"
                            th:value="${od.id}"
                            th:text="${'#' + od.id + ' - ' + od.user.username + ' - ' + #numbers.formatDecimal(od.totalPrice, 0, 'COMMA', 0, 'POINT') + ' đ'}"></option>
                </select>
            </div>

            <div class="mb-3" th:if="${editingShipment != null}">
                <label class="form-label">Order</label>
                <input class="form-control" type="text"
                       th:value="${'#' + editingShipment.order.id + ' - ' + editingShipment.order.user.username}" readonly>
            </div>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Tên người nhận</label>
                    <input class="form-control" name="shippingName" required
                           th:value="${editingShipment != null ? editingShipment.shippingName : ''}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Số điện thoại nhận hàng</label>
                    <input class="form-control" name="shippingPhone" required
                           th:value="${editingShipment != null ? editingShipment.shippingPhone : ''}">
                </div>
            </div>

            <div class="mt-3">
                <label class="form-label">Địa chỉ nhận hàng</label>
                <textarea class="form-control" rows="2" name="shippingAddress" required
                          th:text="${editingShipment != null ? editingShipment.shippingAddress : ''}"></textarea>
            </div>

            <div class="row g-3 mt-1">
                <div class="col-md-6">
                    <label class="form-label">Shipper phụ trách</label>
                    <select class="form-select" name="shipperId">
                        <option value="">-- Chưa gán shipper --</option>
                        <option th:each="sp : ${shippers}"
                                th:value="${sp.id}"
                                th:text="${sp.name + ' (' + sp.user.username + ')'}"
                                th:selected="${editingShipment != null and editingShipment.shipper != null and editingShipment.shipper.id == sp.id}"></option>
                    </select>
                </div>
                <div class="col-md-6" th:if="${editingShipment != null}">
                    <label class="form-label">Trạng thái</label>
                    <select class="form-select" name="status" required>
                        <option th:each="st : ${statuses}"
                                th:value="${st}"
                                th:text="${st}"
                                th:selected="${editingShipment.status == st}"></option>
                    </select>
                </div>
            </div>

            <div class="mt-3" th:if="${editingShipment != null}">
                <label class="form-label">Ghi chú thất bại (chỉ dùng khi chọn trạng thái FAILED)</label>
                <input class="form-control" name="failureNote" th:value="${editingShipment.failureNote}">
            </div>

            <div class="mt-3 p-3 bg-light rounded" th:if="${editingShipment != null}">
                <div class="row g-2 small">
                    <div class="col-md-4"><strong>OTP hiện tại:</strong> <span th:text="${editingShipment.otpCode}"></span></div>
                    <div class="col-md-4"><strong>Xác thực OTP:</strong> <span th:text="${editingShipment.otpVerified ? 'Đã xác thực' : 'Chưa xác thực'}"></span></div>
                    <div class="col-md-4"><strong>Cập nhật:</strong> <span th:text="${#temporals.format(editingShipment.updatedAt, 'dd/MM/yyyy HH:mm')}"></span></div>
                </div>
            </div>

            <div class="d-flex flex-wrap gap-2 mt-4">
                <button class="btn btn-dark" type="submit">Lưu shipment</button>
                <a class="btn btn-outline-secondary" href="/admin/shipments">Quay lại</a>
            </div>
        </form>

        <div class="mt-3 d-flex gap-2" th:if="${editingShipment != null}">
            <form th:action="@{/admin/shipments/{id}/resend-otp(id=${editingShipment.id})}" method="post">
                <button class="btn btn-sm btn-outline-primary" type="submit">Tạo lại và gửi OTP</button>
            </form>
            <form th:if="${canDelete}" th:action="@{/admin/shipments/{id}/delete(id=${editingShipment.id})}" method="post"
                  onsubmit="return confirm('Chỉ shipment ở trạng thái chờ phân công mới được xóa. Xác nhận xóa?');">
                <button class="btn btn-sm btn-outline-danger" type="submit">Xóa shipment</button>
            </form>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
