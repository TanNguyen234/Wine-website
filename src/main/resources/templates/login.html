<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - StrongWine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-modern py-3">
    <div class="container">
        <a class="navbar-brand" href="/home">
            <span class="brand-logo"><i class="fa-solid fa-wine-glass"></i></span>
            <span>StrongWine</span>
        </a>
    </div>
</nav>

<div class="auth-page my-5 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="bg-white border rounded-4 shadow-sm p-4 p-lg-5 fade-up">
                    <div class="text-center mb-5">
                        <div class="bg-light text-dark rounded-circle d-inline-flex align-items-center justify-content-center mb-4" style="width: 64px; height: 64px;">
                            <i class="fa-solid fa-user-lock fs-3 text-accent"></i>
                        </div>
                        <h1 class="h3 fw-bold mb-1">Chào mừng bạn</h1>
                        <p class="text-muted small">Đăng nhập để tiếp tục khám phá thế giới rượu vang</p>
                    </div>

                    <div th:if="${error}" class="alert alert-danger border-0 shadow-sm mb-4 alert-dismissible fade show" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-2 small"></i>
                        <span class="small" th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div th:if="${success}" class="alert alert-success border-0 shadow-sm mb-4 alert-dismissible fade show" role="alert">
                        <i class="fa-solid fa-circle-check me-2 small"></i>
                        <span class="small" th:text="${success}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-4">
                            <label for="username" class="form-label small fw-bold text-muted text-uppercase">Tên đăng nhập</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="name@example.com" required autocomplete="username">
                        </div>
                        <div class="mb-4">
                            <div class="d-flex justify-content-between">
                                <label for="password" class="form-label small fw-bold text-muted text-uppercase">Mật khẩu</label>
                                <a href="/forgot-password" class="small text-muted text-decoration-none">Quên mật khẩu?</a>
                            </div>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                        </div>
                        
                        <div class="d-grid mb-4 pt-2">
                            <button type="submit" class="btn btn-dark btn-lg py-3 shadow-sm rounded-3">
                                Đăng nhập
                            </button>
                        </div>
                    </form>

                    <div class="text-center">
                        <p class="small text-muted mb-0">Chưa có tài khoản? <a href="/register" class="fw-bold text-dark text-underline-hover">Đăng ký ngay</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="site-footer bg-white border-top py-5">
    <div class="container text-center text-muted small">
        <p class="mb-0">© 2026 StrongWine. Tuyệt phẩm cho người sành sỏi.</p>
    </div>
</footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
