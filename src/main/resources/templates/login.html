<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - StrongWine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<nav class="navbar navbar-dark navbar-modern py-2">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/home">
            <span class="brand-logo"><i class="fa-solid fa-wine-glass"></i></span>
            StrongWine
        </a>
        <a href="/wines" class="btn btn-outline-secondary btn-sm">Xem sản phẩm</a>
    </div>
</nav>

<div class="auth-page">
    <div class="auth-card fade-up">
        <div class="auth-header">
            <div class="auth-icon">
                <i class="fa-solid fa-right-to-bracket"></i>
            </div>
            <h2>Đăng nhập</h2>
            <p>Chào mừng quay lại StrongWine</p>
        </div>

        <div class="auth-body">
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Tên đăng nhập</label>
                    <input type="text" class="form-control form-control-lg" id="username" name="username"
                           placeholder="Nhập tên đăng nhập" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control form-control-lg" id="password" name="password"
                           placeholder="Nhập mật khẩu" required>
                </div>
                <button type="submit" class="btn btn-gold btn-lg w-100">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Đăng nhập
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="/forgot-password" style="font-size:.85rem;color:var(--text-muted)">Quên mật khẩu?</a>
            </div>
        </div>

        <div class="auth-footer pb-3">
            Chưa có tài khoản? <a href="/register">Đăng ký ngay</a>
        </div>
    </div>
</div>

<footer class="site-footer text-center" style="position:fixed;bottom:0;left:0;right:0;background:transparent;border:none">
    <div class="container">
        <p class="mb-0" style="font-size:.72rem">© 2026 StrongWine. Tất cả quyền được bảo lưu.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
