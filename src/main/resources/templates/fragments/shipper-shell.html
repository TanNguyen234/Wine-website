<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" data-theme="cellar">

<!-- ======================================================================
     StrongWine — Maison de Vins V3
     Shipper Mobile Courier & PWA Shell Fragment
     Zero Bootstrap / Zero FontAwesome
     ====================================================================== -->

<th:block th:fragment="head(pageTitle)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0c0d10">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
  <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}">
  <meta name="shipper-id" th:if="${shipperId != null}" th:content="${shipperId}">
  <title th:text="${pageTitle != null ? pageTitle + ' — StrongWine Shipper' : 'StrongWine Shipper'}">StrongWine Shipper</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg(v='20261114c')}">
  <link rel="manifest" th:href="@{/manifest.webmanifest}">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("sw_theme");
        var theme = saved === "ivory" || saved === "cellar" ? saved : "cellar";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (_) {
        document.documentElement.setAttribute("data-theme", "cellar");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/tokens.css(v='20261114c')}">
  <link rel="stylesheet" th:href="@{/css/shipper.css(v='20261114c')}">
</th:block>

<header th:fragment="header(shipperName)" class="shipper-header">
  <a th:href="@{/shipper/dashboard}" class="shipper-brand">
    <span class="shipper-brand-badge" aria-hidden="true">
      <th:block th:replace="~{fragments/icons :: icon('wax-seal')}"/>
    </span>
    <span>
      <span class="shipper-brand-title">StrongWine Courier</span>
      <span class="shipper-brand-sub" th:text="${shipperName != null ? shipperName : 'Đối tác giao nhận'}">Đối tác giao nhận</span>
    </span>
  </a>

  <div class="shipper-header-actions">
    <button type="button"
            class="shipper-icon-btn"
            data-theme-toggle="true"
            aria-pressed="false"
            aria-label="Chuyển giao diện ban ngày hoặc ban đêm">
      <span data-theme-icon="sun"><th:block th:replace="~{fragments/icons :: icon('sun')}"/></span>
      <span data-theme-icon="moon" hidden><th:block th:replace="~{fragments/icons :: icon('moon')}"/></span>
    </button>

    <form th:action="@{/logout}" method="post">
      <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit" class="shipper-icon-btn" title="Đăng xuất">
        <span>Thoát</span>
      </button>
    </form>
  </div>
</header>

<nav th:fragment="bottomNav(activeTab)" class="shipper-bottom-nav" aria-label="Điều hướng Shipper">
  <a th:href="@{/shipper/dashboard}"
     class="shipper-nav-item"
     th:classappend="${activeTab == 'dashboard'} ? ' active' : ''"
     th:attr="aria-current=${activeTab == 'dashboard'} ? 'page' : null">
    <th:block th:replace="~{fragments/icons :: icon('truck')}"/>
    <span>Chuyến giao</span>
  </a>

  <a th:href="@{/shipper/cod-batches}"
     class="shipper-nav-item"
     th:classappend="${activeTab == 'cod'} ? ' active' : ''"
     th:attr="aria-current=${activeTab == 'cod'} ? 'page' : null">
    <th:block th:replace="~{fragments/icons :: icon('cod-wallet')}"/>
    <span>Nộp COD</span>
  </a>

  <a th:href="@{/profile}"
     class="shipper-nav-item"
     th:classappend="${activeTab == 'account'} ? ' active' : ''"
     th:attr="aria-current=${activeTab == 'account'} ? 'page' : null">
    <th:block th:replace="~{fragments/icons :: icon('shield')}"/>
    <span>Hồ sơ</span>
  </a>
</nav>

<th:block th:fragment="scripts">
  <div id="swToastRegion" class="sw-toast-region" popover="manual" role="status" aria-live="polite"></div>
  <script th:src="@{/js/theme-toggle.js}" defer></script>
  <script th:src="@{/js/dialog-kit.js}" defer></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw-shipper.js", { scope: "/shipper/" }).catch(function () {
          // Ignore registration issues in unsupported or insecure test origins
        });
      });
    }
  </script>
</th:block>

</html>
