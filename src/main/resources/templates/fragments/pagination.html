<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<body>
<div th:fragment="pagination(baseUrl)" class="sw-pagination"
     th:with="curPage=${currentPage != null ? currentPage : 0},
              pgSize=${pageSize != null ? pageSize : 12},
              totEntries=${totalEntries != null ? totalEntries : 0},
              totPages=${totalPages != null ? totalPages : 1},
              hasPrev=${hasPrevious != null ? hasPrevious : (curPage > 0)},
              hasNxt=${hasNext != null ? hasNext : (curPage + 1 < totPages)}">
    <div class="muted small">
        Hiển thị <strong th:text="${totEntries == 0 ? 0 : (curPage * pgSize) + 1}">0</strong> &ndash;
        <strong th:text="${(curPage * pgSize) + pgSize > totEntries ? totEntries : (curPage * pgSize) + pgSize}">0</strong>
        trong tổng số <strong th:text="${totEntries}">0</strong> kết quả
    </div>

    <nav aria-label="Phân trang danh sách" th:if="${totPages > 1}">
        <ul class="sw-page-list">
            <li class="sw-page-item" th:classappend="${!hasPrev} ? 'disabled'">
                <a class="sw-page-link"
                   th:href="@{${baseUrl}(page=${curPage - 1},size=${pgSize},sortBy=${sortBy},sortDir=${sortDir})}"
                   aria-label="Trang trước">&larr;</a>
            </li>
            <li class="sw-page-item"
                th:each="i : ${#numbers.sequence(0, totPages - 1)}"
                th:classappend="${curPage == i} ? 'active'">
                <a class="sw-page-link"
                   th:href="@{${baseUrl}(page=${i},size=${pgSize},sortBy=${sortBy},sortDir=${sortDir})}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="sw-page-item" th:classappend="${!hasNxt} ? 'disabled'">
                <a class="sw-page-link"
                   th:href="@{${baseUrl}(page=${curPage + 1},size=${pgSize},sortBy=${sortBy},sortDir=${sortDir})}"
                   aria-label="Trang kế tiếp">&rarr;</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
