<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ======================================================================
     StrongWine — Maison de Vins V3 Bespoke 1.5px Stroke Wine & Commerce Icons
     19 glyphs: wine-glass, decanter, oak-barrel, wax-seal, grape-cluster,
     verified-bottle, warehouse-map, cod-wallet, bell, heart, sun, moon,
     search, cart, menu, close, truck, shield, check
     ====================================================================== -->

<th:block th:fragment="icon(name)">
  <th:block th:replace="~{fragments/icons :: iconSized(${name}, '')}"/>
</th:block>

<th:block th:fragment="iconSized(name, extraClass)">

       th:class="${extraClass != null and !#strings.isEmpty(extraClass)} ? 'sw-icon sw-icon--' + ${name} + ' ' + ${extraClass} : 'sw-icon sw-icon--' + ${name}"
       viewBox="0 0 24 24"
       width="20"
       height="20"
       fill="none"
       stroke="currentColor"
       stroke-width="1.5"
       stroke-linecap="round"
       stroke-linejoin="round"
       aria-hidden="true"
       th:switch="${name}">
    <g th:case="'wine-glass'">
      <path d="M8 2h8l1 5.5a5 5 0 0 1-10 0L8 2Z"/>
      <path d="M7.6 8.5c2.2-1 6.6 1 8.8 0"/>
      <path d="M12 13.5V21"/>
      <path d="M8 21h8"/>
    </g>
    <g th:case="'decanter'">
      <path d="M10 2h4"/>
      <path d="M10.5 2v4.5L6.2 14.3A5.2 5.2 0 0 0 10.8 22h2.4a5.2 5.2 0 0 0 4.6-7.7L13.5 6.5V2"/>

    </g>
    <g th:case="'oak-barrel'">

      <circle cx="12" cy="12" r="1"/>
    </g>
    <g th:case="'wax-seal'">

    </g>
    <g th:case="'grape-cluster'">

      <path d="M12 4.5c2.2-1.6 4.5-1.2 5.5.5-2 .6-3.7.4-5.5-.5Z"/>

      <path d="M3 10h18"/>
      <path d="M15 14.5h6"/>
      <circle cx="16.5" cy="14.5" r="0.8"/>

    <g th:case="'bell'">

    <g th:case="'search'">
      <circle cx="10.8" cy="10.8" r="6.8"/>

    <g th:case="'cart'">
      <path d="M3 4h2.6l2.1 10.2a1.5 1.5 0 0 0 1.5 1.2h8.5a1.5 1.5 0 0 0 1.4-1.1L20.8 7H6.2"/>
      <circle cx="9.5" cy="19.5" r="1.4"/>

    <g th:case="'menu'">

    <g th:case="'close'">
      <path d="M6 6l12 12M18 6L6 18"/>

    <g th:case="'truck'">

    <g th:case="'check'">

    <g th:case="*">
