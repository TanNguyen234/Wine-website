<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-shell :: head('Thông tin sản phẩm rượu')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin-shell :: sidebar(${wine != null and wine.id != null ? 'wines' : 'wine-create'})}"></aside>

    <div class="admin-main-wrap">
        <header th:replace="~{fragments/admin-shell :: topbar}"></header>

        <main class="admin-main" id="main-content" th:with="isEditing=${wine != null and wine.id != null}">
            <div class="admin-page-header">
                <div>
                    <h1 class="admin-page-title"
                        th:text="${isEditing ? ('Chỉnh sửa rượu: ' + wine.name) : 'Thêm sản phẩm rượu mới'}">Thông tin sản phẩm rượu</h1>
                    <p class="admin-page-subtitle">Cập nhật tên chai rượu, dòng rượu (bao gồm Rượu truyền thống), niên vụ, giá bán và hình ảnh.</p>
                </div>
                <a th:href="@{/admin/wines}" class="btn btn-secondary btn-sm">Quay lại danh mục</a>
            </div>

            <div th:if="${error != null}" class="admin-card mb-3" role="alert" style="border-left: 4px solid var(--status-danger-ink);">
                <strong class="status bad">Lỗi</strong>
                <span class="ms-2" th:text="${error}">Không thể lưu sản phẩm rượu.</span>
            </div>

            <section class="admin-card">
                <form th:action="${isEditing ? '/admin/wines/edit/' + wine.id : '/admin/wines/create'}"
                      method="post"
                      enctype="multipart/form-data"
                      class="admin-form-grid">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="form-group">
                        <label for="wineName" class="form-label">Tên chai rượu</label>
                        <input type="text" id="wineName" name="name" class="form-control"
                               th:value="${wine != null ? wine.name : ''}" placeholder="VD: Château Margaux Grand Cru" required/>
                    </div>

                    <div class="form-group">
                        <label for="wineType" class="form-label">Dòng rượu</label>
                        <select id="wineType" name="type" class="form-select" required>
                            <option value="Red" th:selected="${wine != null and wine.type == 'Red'}">Vang đỏ (Red)</option>
                            <option value="White" th:selected="${wine != null and wine.type == 'White'}">Vang trắng (White)</option>
                            <option value="Rose" th:selected="${wine != null and wine.type == 'Rose'}">Vang hồng (Rosé)</option>
                            <option value="Sparkling" th:selected="${wine != null and wine.type == 'Sparkling'}">Vang sủi bọt (Sparkling)</option>
                            <option value="Traditional" th:selected="${wine != null and wine.type == 'Traditional'}">Rượu truyền thống (Traditional)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="wineCountry" class="form-label">Quốc gia / Vùng nho</label>
                        <input type="text" id="wineCountry" name="country" class="form-control"
                               th:value="${wine != null ? wine.country : ''}" placeholder="VD: Pháp, Ý, Việt Nam"/>
                    </div>

                    <div class="form-group">
                        <label for="wineYear" class="form-label">Niên vụ (Vintage)</label>
                        <input type="number" id="wineYear" name="year" class="form-control"
                               min="1900" max="2100"
                               th:value="${wine != null and wine.year != null ? wine.year : 2020}" required/>
                    </div>

                    <div class="form-group">
                        <label for="winePrice" class="form-label">Giá bán (VND)</label>
                        <input type="number" id="winePrice" name="price" class="form-control"
                               min="1000" step="1000"
                               th:value="${wine != null ? wine.price : ''}" required/>
                    </div>

                    <div class="form-group">
                        <label for="wineImageFile" class="form-label">Tải ảnh sản phẩm (JPG / PNG, tối đa 5MB)</label>
                        <input type="file" id="wineImageFile" name="imageFile" class="form-control" accept="image/jpeg,image/png"/>
                    </div>

                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label for="wineImageUrl" class="form-label">Hoặc nhập URL ảnh</label>
                        <input type="text" id="wineImageUrl" name="imageUrl" class="form-control"
                               th:value="${wine != null ? wine.imageUrl : ''}"
                               placeholder="https://... hoặc /images/wine.jpg"/>
                        <div class="mt-2" th:if="${wine != null and wine.imageUrl != null and !#strings.isEmpty(wine.imageUrl)}">
                            <img th:src="${wine.imageUrl}" th:alt="${wine.name}"
                                 style="width: 72px; height: 96px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-hairline);"/>
                        </div>
                    </div>

                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label for="wineDescription" class="form-label">Ghi chú hương vị &amp; mô tả chi tiết</label>
                        <textarea id="wineDescription" name="description" rows="4" class="form-control"
                                  th:text="${wine != null ? wine.description : ''}"
                                  placeholder="Mô tả tầng hương vị, gỗ sồi, món ăn kết hợp..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2" style="grid-column: 1 / -1;">
                        <a th:href="@{/admin/wines}" class="btn btn-secondary">Hủy</a>
                        <button type="submit" class="btn btn-primary"
                                th:text="${isEditing ? 'Lưu thay đổi sản phẩm' : 'Tạo sản phẩm mới'}">Lưu sản phẩm</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
</div>

<div th:replace="~{fragments/admin-shell :: scripts}"></div>
</body>
</html>
