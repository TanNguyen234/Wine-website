<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin-shell :: head((${wine != null and wine.id != null} ? 'Chỉnh Sửa Rượu Vang' : 'Thêm Rượu Vang Mới') + ' · StrongWine')}"></head>
<body>
<div class="admin-shell">
    <aside th:replace="~{fragments/admin-shell :: sidebar('wineform')}"></aside>

    <div class="admin-main">
        <header th:replace="~{fragments/admin-shell :: topbar}"></header>

        <main class="admin-content" style="max-width:860px">
            <div th:if="${message}" class="alert-sw success mb16" th:text="${message}"></div>
            <div th:if="${error}" class="alert-sw danger mb16" th:text="${error}"></div>

            <div class="admin-head">
                <div>
                    <div class="eyebrow">QUẢN LÝ SẢN PHẨM HẦM RƯỢU</div>
                    <h1 th:text="${wine != null and wine.id != null ? 'Cập nhật: ' + wine.name : 'Thêm chai rượu vang mới'}">Wine Form</h1>
                </div>
                <a th:href="@{/wines}" class="btn btn-outline btn-sm">&larr; Quay lại danh mục</a>
            </div>

            <section class="admin-card">
                <form th:action="${wine != null and wine.id != null} ? @{/wines/admin/edit/{id}(id=${wine.id})} : @{/wines/admin/create}"
                      method="post" enctype="multipart/form-data" class="stack">
                    <div>
                        <label class="label" for="name">Tên rượu vang *</label>
                        <input type="text" id="name" name="name" class="field" required
                               th:value="${wine != null ? wine.name : ''}"
                               placeholder="Ví dụ: Château Margaux Premier Grand Cru Classé">
                    </div>

                    <div class="grid-3">
                        <div>
                            <label class="label" for="type">Dòng rượu vang *</label>
                            <select id="type" name="type" class="select" required>
                                <option value="Red" th:selected="${wine != null and wine.type != null and wine.type == 'Red'}">Vang đỏ (Red)</option>
                                <option value="White" th:selected="${wine != null and wine.type != null and wine.type == 'White'}">Vang trắng (White)</option>
                                <option value="Rose" th:selected="${wine != null and wine.type != null and wine.type == 'Rose'}">Vang hồng (Rosé)</option>
                                <option value="Sparkling" th:selected="${wine != null and wine.type != null and wine.type == 'Sparkling'}">Vang sủi (Sparkling)</option>
                            </select>
                        </div>
                        <div>
                            <label class="label" for="country">Quốc gia xuất xứ *</label>
                            <input type="text" id="country" name="country" class="field" required
                                   th:value="${wine != null ? wine.country : ''}" placeholder="Pháp, Ý, Chile...">
                        </div>
                        <div>
                            <label class="label" for="year">Niên vụ (Vintage)</label>
                            <input type="number" id="year" name="year" class="field" min="1900" max="2030"
                                   th:value="${wine != null ? wine.year : 2020}">
                        </div>
                    </div>

                    <div class="grid-2">
                        <div>
                            <label class="label" for="price">Giá niêm yết (VNĐ) *</label>
                            <input type="number" id="price" name="price" class="field" min="0" step="1000" required
                                   th:value="${wine != null ? wine.price : ''}" placeholder="1850000">
                        </div>
                        <div>
                            <label class="label" for="imageUrl">Đường dẫn ảnh sản phẩm (URL)</label>
                            <input type="text" id="imageUrl" name="imageUrl" class="field"
                                   th:value="${wine != null ? wine.imageUrl : ''}" placeholder="/uploads/... hoặc https://...">
                        </div>
                    </div>

                    <div>
                        <label class="label" for="imageFile">Hoặc tải ảnh chụp chai rượu lên từ máy tính</label>
                        <input type="file" id="imageFile" name="imageFile" class="field" accept="image/*">
                    </div>

                    <div>
                        <label class="label" for="description">Ghi chú hương vị &amp; mô tả chi tiết</label>
                        <textarea id="description" name="description" class="textarea" rows="4"
                                  placeholder="Mô tả hương thơm, cấu trúc tannin, hậu vị và gợi ý món ăn kết hợp..."
                                  th:text="${wine != null ? wine.description : ''}"></textarea>
                    </div>

                    <div class="between pt16" style="border-top:1px solid var(--sw-line)">
                        <a th:href="@{/wines}" class="btn btn-outline">Huỷ</a>
                        <button type="submit" class="btn">Lưu thông tin sản phẩm</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
</div>
<div th:replace="~{fragments/admin-shell :: scripts}"></div>
</body>
</html>
