<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người giao hàng - StrongWine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<nav class="navbar navbar-dark navbar-modern py-3">
    <div class="container d-flex justify-content-between">
        <a class="navbar-brand" href="/admin">StrongWine Quản trị</a>
        <div class="d-flex gap-2">
            <a class="btn btn-sm btn-outline-light" href="/admin/shipments">Đơn giao hàng</a>
            <a class="btn btn-sm btn-light" href="/admin/shippers/create">Thêm người giao hàng</a>
        </div>
    </div>
</nav>

<main class="container my-4">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-md-4">
            <div class="panel p-3 h-100">
                <div class="small text-muted">Tổng số người giao hàng</div>
                <div class="h4 mb-0" th:text="${shipperStats['total']}">0</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="panel p-3 h-100">
                <div class="small text-muted">Người giao hàng đang hoạt động</div>
                <div class="h4 mb-0" th:text="${shipperStats['active']}">0</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="panel p-3 h-100">
                <div class="small text-muted">Người giao hàng sẵn sàng nhận đơn</div>
                <div class="h4 mb-0" th:text="${shipperStats['available']}">0</div>
            </div>
        </div>
    </div>

    <div class="panel p-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h5 mb-0">Danh sách người giao hàng</h1>
            <a class="btn btn-sm btn-outline-dark" href="/admin/shipments">Quản lý đơn giao hàng</a>
        </div>
        <div class="table-responsive">
            <table class="table table-modern table-sm align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Tài khoản</th>
                    <th>Tên</th>
                    <th>Điện thoại</th>
                    <th>Phương tiện</th>
                    <th>Trạng thái</th>
                    <th>Sẵn sàng</th>
                    <th>Cập nhật</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${shippers}">
                    <td th:text="${s.id}"></td>
                    <td th:text="${s.user.username}"></td>
                    <td th:text="${s.name}"></td>
                    <td th:text="${s.phone}"></td>
                    <td th:text="${s.vehicleType}"></td>
                    <td><span class="badge text-bg-secondary" th:text="${@enumDisplayService.shipperStatus(s.status)}"></span></td>
                    <td>
                        <span th:class="${s.isAvailable ? 'badge text-bg-success' : 'badge text-bg-warning'}"
                              th:text="${s.isAvailable ? 'Sẵn sàng' : 'Tạm nghỉ'}"></span>
                    </td>
                    <td th:text="${#temporals.format(s.updatedAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <div class="d-flex gap-2">
                            <a class="btn btn-sm btn-outline-dark" th:href="@{/admin/shippers/edit/{id}(id=${s.id})}">Sửa</a>
                            <form th:action="@{/admin/shippers/delete/{id}(id=${s.id})}" method="post" onsubmit="return confirm('Bạn có chắc muốn xóa người giao hàng này?');">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
