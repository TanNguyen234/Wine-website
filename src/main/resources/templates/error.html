<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lỗi StrongWine</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #0d0b0c; color: #f3ece4; font-family: system-ui, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 520px; text-align: center; }
    .code { font-size: 14px; letter-spacing: .12em; color: #b9a58a; margin: 0 0 8px; }
    h1 { font-size: 28px; line-height: 1.25; margin: 0 0 12px; font-weight: 600; }
    p { color: #c8bfb5; line-height: 1.6; margin: 0; }
    a { display: inline-block; margin-top: 24px; padding: 12px 20px; border: 1px solid #8b2f3a; border-radius: 6px;
        color: #f3ece4; text-decoration: none; }
  </style>
</head>
<body>
<main>
  <p class="code" th:text="${status != null ? 'HTTP ' + status : 'Lỗi'}">HTTP</p>
  <h1 th:text="${status == 403 ? 'Bạn không có quyền truy cập trang này' : (status == 404 ? 'Không tìm thấy trang' : 'Hệ thống gặp lỗi, vui lòng thử lại')}">Đã xảy ra lỗi</h1>
  <p>Vui lòng quay lại trang chủ hoặc đăng nhập bằng tài khoản có quyền phù hợp.</p>
  <a th:href="@{/home}">Về trang chủ</a>
</main>
</body>
</html>
