spring.application.name=strongwine

# UTF-8 encoding configuration
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.thymeleaf.encoding=UTF-8
spring.messages.encoding=UTF-8
spring.web.locale=vi_VN
spring.web.locale-resolver=fixed
spring.mandatory-file-encoding=UTF-8
server.tomcat.uri-encoding=UTF-8

# SQL Server Database Configuration
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=winestore_2;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.data-source-properties.sendStringParametersAsUnicode=true

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Execute schema.sql and data.sql on startup safely
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true
spring.sql.init.separator=;

# Flyway migration settings
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Application Configuration
app.upload.dir=uploads

# Payment Configuration - Use Environment Variables for Security
# DO NOT commit real keys to Git!
# Set these in .env file or system environment variables
stripe.secretKey=${STRIPE_SECRET_KEY:}
stripe.publicKey=${STRIPE_PUBLIC_KEY:}
stripe.webhookSecret=${STRIPE_WEBHOOK_SECRET:}

# VNPay configuration
vnpay.tmnCode=${VNP_TMN_CODE:}
vnpay.hashSecret=${VNP_HASH_SECRET:}
vnpay.payUrl=${VNP_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.returnUrl=${VNP_RETURN_URL:}
vnpay.version=${VNP_VERSION:2.1.0}
vnpay.command=${VNP_COMMAND:pay}
vnpay.orderType=${VNP_ORDER_TYPE:other}
vnpay.locale=${VNP_LOCALE:vn}
vnpay.expireMinutes=${VNP_EXPIRE_MINUTES:15}

# JWT configuration
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Shipment OTP email configuration
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@strongwine.local}
app.mail.fallback-recipient=${APP_MAIL_FALLBACK_RECIPIENT:${MAIL_USERNAME:}}
app.mail.allow-fallback-recipient=${APP_MAIL_ALLOW_FALLBACK_RECIPIENT:false}
app.mail.retry-max-attempts=${APP_MAIL_RETRY_MAX_ATTEMPTS:3}
app.mail.retry-initial-backoff-ms=${APP_MAIL_RETRY_INITIAL_BACKOFF_MS:250}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_SSL_TRUST:${MAIL_HOST:}}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=${MAIL_SMTP_SSL_CHECKSERVERIDENTITY:false}
spring.mail.properties.mail.smtp.ssl.protocols=${MAIL_SMTP_SSL_PROTOCOLS:TLSv1.2 TLSv1.3}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:10000}

# Auto reconcile paid orders to shipments
app.shipment.reconcile.startup-enabled=${APP_SHIPMENT_RECONCILE_STARTUP_ENABLED:false}
app.shipment.reconcile.web-enabled=${APP_SHIPMENT_RECONCILE_WEB_ENABLED:false}
app.shipment.reconcile.web-throttle-ms=${APP_SHIPMENT_RECONCILE_WEB_THROTTLE_MS:60000}

# Periodic pending-shipment auto dispatch
app.shipment.dispatch.enabled=${APP_SHIPMENT_DISPATCH_ENABLED:true}
app.shipment.dispatch.initial-delay-ms=${APP_SHIPMENT_DISPATCH_INITIAL_DELAY_MS:15000}
app.shipment.dispatch.fixed-delay-ms=${APP_SHIPMENT_DISPATCH_FIXED_DELAY_MS:60000}

# User password reset configuration
app.password-reset.token-ttl-minutes=${APP_PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
app.password-reset.base-url=${APP_PASSWORD_RESET_BASE_URL:}

# Gemini assistant configuration
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
